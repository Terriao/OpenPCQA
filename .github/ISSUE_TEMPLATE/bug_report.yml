# ============================================================
# File: .github/ISSUE_TEMPLATE/bug_report.yml
# Repo: https://github.com/Terriao/OpenPCQA
# ============================================================

name: 🐛 Bug report
description: Something is broken or behaving unexpectedly in OpenPCQA.
title: "[BUG] "
labels: ["bug", "triage"]
assignees:
  - Terriao

body:
  - type: markdown
    attributes:
      value: |
        ### 👋 Thanks for taking the time to report a bug!
        Please fill in the fields below as completely as you can. The more detail you give, the faster we can help.

  - type: dropdown
    id: component
    attributes:
      label: 📍 Which component is affected?
      options:
        - "Objective metric (please specify in description)"
        - "Subjective evaluation pipeline"
        - "Correlation / statistics computation (PLCC, SROCC, RMSE, KRCC)"
        - "Dataset loader / file I/O"
        - "Point cloud preprocessing (downsampling, normalisation, projection)"
        - "GPU / CUDA-accelerated module"
        - "Main README / documentation"
        - "Method sub-README"
        - "Installation / dependency"
        - "Other (describe below)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 🔥 What happened?
      description: A clear description of the bug. What did you expect, and what did you see instead?
      placeholder: "When I run metric XXX on the SJTU-PCQA dataset, the PLCC drops to 0.12, whereas the paper reports 0.89."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🪜 Steps to reproduce
      description: Minimal steps that reliably reproduce the bug. Include the exact commands and config values.
      placeholder: |
        1. Clone OpenPCQA at commit XXX
        2. Install with `pip install -r requirements.txt`
        3. Run `python demo_metric5.py --dataset SJTU-PCQA --config configs/default.yaml`
        4. Observe wrong output PLCC
      render: bash
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 🖥️ Environment
      description: OS, Python version, key dependencies, GPU (if relevant).
      placeholder: |
        - OS: Ubuntu 22.04 (also reproduces on Windows 11)
        - Python: 3.10.12
        - Key packages: numpy 1.24.4, scipy 1.10.1, open3d 0.17.0, torch 2.1.0+cu118
        - Hardware: NVIDIA RTX 3090 (24 GB VRAM) / CPU only
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: 📊 Dataset and input
      description: Which dataset / point cloud were you using? A link or filename is fine.
      placeholder: "SJTU-PCQA, sequence `redandblack` at distortion level 5."

  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs / traceback
      description: Paste the full Python traceback or relevant output (no need for surrounding code).
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: ✅ Pre-flight checklist
      options:
        - label: I have searched the existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have read the relevant section of the README / sub-README.
          required: true
        - label: I am willing to test a proposed fix and report back.
          required: false
